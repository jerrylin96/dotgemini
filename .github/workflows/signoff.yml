name: Signoff Verification Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-signoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch Git Notes
        run: |
          # Fetch notes from remote into tracking ref and merge via cat_sort_uniq strategy per GSA §2.5
          # Note for Fork PRs: Fork PRs require notes pushed to base repository or PR head refs.
          git fetch origin +refs/notes/signoff:refs/notes/signoff-remote 2>/dev/null || true
          git notes --ref=signoff merge -s cat_sort_uniq refs/notes/signoff-remote 2>/dev/null || true

      - name: Verify Git Signoff Attestation
        env:
          SIGNOFF_EVENT_NAME: ${{ github.event_name }}
          SIGNOFF_REF: ${{ github.ref }}
          SIGNOFF_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          # Trust & Authenticity Model:
          # Unsigned trailers and notes verify only that a syntactically valid, self-attested GSA record is present.
          # They do not prove that a Socratic review occurred or establish independent human identity.
          # Cryptographic signing (git commit -S) and trusted reviewer verification remain required if independent identity assurance is intended.
          # REAL ENFORCEMENT REQUIRES A GITHUB BRANCH PROTECTION RULE requiring 'Signoff Verification Gate' on 'main'.
          #
          # Event Model & Push Semantics:
          # 1. pull_request runs: Pre-merge gating. Strictly evaluates only PR HEAD/tree (Checks 1-3) with zero parent fallback.
          # 2. push runs on main: Post-hoc tripwire for continuous verification & status badge.
          #    - Direct commits / squash merges: verified directly via HEAD commit/tree notes (Checks 1-3).
          #    - Merge commits (e.g. sequential merges): evaluates HEAD^2 if and only if:
          #      a) Exactly two parents (rejects octopus merges).
          #      b) SIGNOFF_EVENT_BEFORE is valid, non-zero, and equals HEAD^1 (ensures main was previous tip before merge).
          #      c) HEAD^2 is not an ancestor of HEAD^1 (brings new branch work).
          #      d) HEAD^{tree} matches canonical 3-way merge result: git merge-tree --write-tree HEAD^1 HEAD^2.
          #      e) HEAD^2 is validly attested (Checks 1-3).
          #    Known limitations:
          #    - Batch pushes with multiple merges fail closed; merge PRs sequentially.
          #    - Merges with manual conflict resolutions (resolved tree != git merge-tree --write-tree HEAD^1 HEAD^2) fail closed on push; remediation is to push an attestation note on the merged tree.

          set -eo pipefail

          HEAD_SHA=$(git rev-parse HEAD)
          HEAD_TREE=$(git rev-parse HEAD^{tree})
          EVENT_NAME="${SIGNOFF_EVENT_NAME:-${GITHUB_EVENT_NAME:-pull_request}}"
          REF_NAME="${SIGNOFF_REF:-${GITHUB_REF:-refs/heads/main}}"
          EVENT_BEFORE="${SIGNOFF_EVENT_BEFORE:-}"
          echo "Verifying signoff attestation for SHA (${HEAD_SHA}) / TREE (${HEAD_TREE}) [event=${EVENT_NAME} ref=${REF_NAME}]..."

          IS_VALID=0

          validate_payload() {
            local payload="$1"
            local expected_tree="$2"
            local expected_commit="$3"

            # Require exactly one occurrence of each mandatory GSA field (reject duplicates & conflicts)
            local c_spec c_status c_tree c_commit c_verifier
            c_spec=$(echo "$payload" | (grep -c -E "^Signoff-Spec-Version:" || true))
            c_status=$(echo "$payload" | (grep -c -E "^Signoff-Status:" || true))
            c_tree=$(echo "$payload" | (grep -c -E "^Signoff-Reviewed-Tree-SHA:" || true))
            c_commit=$(echo "$payload" | (grep -c -E "^Signoff-Reviewed-Commit-SHA:" || true))
            c_verifier=$(echo "$payload" | (grep -c -E "^Signoff-Verified-By:" || true))

            if [ "$c_spec" -ne 1 ] || [ "$c_status" -ne 1 ] || [ "$c_tree" -ne 1 ] || [ "$c_commit" -ne 1 ] || [ "$c_verifier" -ne 1 ]; then
              return 1
            fi

            local spec_ver status rev_tree rev_commit verifier
            spec_ver=$(echo "$payload" | (grep -E "^Signoff-Spec-Version:" || true) | cut -d':' -f2 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            status=$(echo "$payload" | (grep -E "^Signoff-Status:" || true) | cut -d':' -f2 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            rev_tree=$(echo "$payload" | (grep -E "^Signoff-Reviewed-Tree-SHA:" || true) | cut -d':' -f2 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            rev_commit=$(echo "$payload" | (grep -E "^Signoff-Reviewed-Commit-SHA:" || true) | cut -d':' -f2 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            verifier=$(echo "$payload" | (grep -E "^Signoff-Verified-By:" || true) | cut -d':' -f2- | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

            # 1. Spec version must be 1.0
            if [ "$spec_ver" != "1.0" ]; then
              return 1
            fi

            # 2. Status must be exact GSA enum
            if [ "$status" != "VERIFIED_BY_HUMAN" ] && [ "$status" != "VERIFIED_BY_HUMAN_NO_TRANSCRIPT_DIGEST" ]; then
              return 1
            fi

            # 3. Reviewed tree SHA must be present, 40-hex, and match expected_tree
            if ! [[ "$rev_tree" =~ ^[0-9a-fA-F]{40}$ ]]; then
              return 1
            fi
            if [ "$rev_tree" != "$expected_tree" ]; then
              return 1
            fi

            # 4. Reviewed commit SHA must be present and valid 40-hex
            if ! [[ "$rev_commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
              return 1
            fi

            # 5. If expected_commit is supplied, rev_commit must match expected_commit
            if [ -n "$expected_commit" ]; then
              if [ "$rev_commit" != "$expected_commit" ]; then
                return 1
              fi
            fi

            # 6. Verifier must be non-empty and not whitespace-only (GSA §2.1)
            if [ -z "$verifier" ]; then
              return 1
            fi

            return 0
          }

          validate_note_payload() {
            local payload="$1"
            local expected_tree="$2"
            local expected_commit="$3"

            [ -n "$payload" ] || return 1

            printf '%s\n' "$payload" | python3 scripts/validate_gsa_note.py - "$expected_tree" "$expected_commit"
          }

          verify_target() {
            local target_sha="$1"
            local target_tree="$2"
            local label="$3"

            # --- Check 1: Empty GSA Attestation Commit ---
            local payload parent_tree parent_sha
            payload=$(git log -1 --format="%(trailers:only=true)" "$target_sha")
            if [ -n "$payload" ] && git rev-parse --verify -q "${target_sha}~1" >/dev/null; then
              parent_tree=$(git rev-parse "${target_sha}~1^{tree}" 2>/dev/null || true)
              parent_sha=$(git rev-parse "${target_sha}~1" 2>/dev/null || true)
              if [ "$parent_tree" = "$target_tree" ]; then
                if validate_payload "$payload" "$target_tree" "$parent_sha"; then
                  echo "✅ Git Signoff Attestation verified via empty attestation commit on ${label}."
                  return 0
                fi
              fi
            fi

            # --- Check 2: Git note on commit SHA ---
            local note_commit
            note_commit=$(git notes --ref=signoff show "$target_sha" 2>/dev/null || true)
            if [ -n "$note_commit" ]; then
              if validate_note_payload "$note_commit" "$target_tree" "$target_sha"; then
                echo "✅ Git Signoff Attestation verified via commit note on ${label}."
                return 0
              fi
            fi

            # --- Check 3: Git note on tree SHA (GSA §5.1 Tree Fallback) ---
            local note_tree
            note_tree=$(git notes --ref=signoff show "$target_tree" 2>/dev/null || true)
            if [ -n "$note_tree" ]; then
              if validate_note_payload "$note_tree" "$target_tree" ""; then
                echo "✅ Git Signoff Attestation verified via tree note fallback on ${label} (GSA §5.1)."
                return 0
              fi
            fi

            return 1
          }

          if verify_target "$HEAD_SHA" "$HEAD_TREE" "HEAD"; then
            IS_VALID=1
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "refs/heads/main" ] && git rev-parse --verify -q HEAD^2 >/dev/null; then
            # Push-provenance merge fallback for sequential PR merges on main:
            # 1. Require exactly two parents (reject octopus merges)
            # 2. Require valid, non-zero SIGNOFF_EVENT_BEFORE matching HEAD^1 (ensures main-side parent is exactly the previous main tip)
            # 3. Require HEAD^2 not to be an ancestor of HEAD^1 (ensures HEAD^2 brings new work)
            # 4. Require HEAD^{tree} to match canonical merge-tree result of HEAD^1 and HEAD^2 (rejects crafted dirty trees)
            # 5. Require HEAD^2 to pass verify_target
            if ! git rev-parse --verify -q HEAD^3 >/dev/null && \
               [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ] && \
               [ "$EVENT_BEFORE" = "$(git rev-parse HEAD^1)" ] && \
               ! git merge-base --is-ancestor HEAD^2 HEAD^1; then
              EXPECTED_MERGE_TREE=$(git merge-tree --write-tree HEAD^1 HEAD^2 2>/dev/null || true)
              if [ -n "$EXPECTED_MERGE_TREE" ] && [ "$EXPECTED_MERGE_TREE" = "$HEAD_TREE" ]; then
                MERGE_PR_HEAD=$(git rev-parse HEAD^2)
                MERGE_PR_TREE=$(git rev-parse HEAD^2^{tree})
                if verify_target "$MERGE_PR_HEAD" "$MERGE_PR_TREE" "merged PR branch head (HEAD^2)"; then
                  IS_VALID=1
                fi
              fi
            fi
          fi

          if [ "$IS_VALID" -eq 1 ]; then
            echo "✅ Git Signoff Attestation gate PASSED for SHA ${HEAD_SHA}."
            exit 0
          else
            if [ "$EVENT_NAME" = "push" ]; then
              echo "::error::main contains commit(s) not covered by a signoff attestation on head (${HEAD_SHA})! Check workflow run logs."
            else
              echo "::error::Missing, incomplete, or mismatched Git Signoff Attestation on head (${HEAD_SHA})! Run /signoff on latest head and push refs/notes/signoff before merging."
            fi
            exit 1
          fi
