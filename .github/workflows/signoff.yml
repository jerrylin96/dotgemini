name: attested by humans

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read   # scan-refs: allows discovering PR attestation evidence for squash/rebase merges

jobs:
  verify-signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jerrylin96/git-signoff/verify@verify-v1.7
