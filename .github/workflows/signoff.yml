name: Signoff Verification Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-signoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch Git Notes
        run: |
          # Fetch notes from remote into tracking ref and merge via cat_sort_uniq strategy per GSA §2.5
          # Note for Fork PRs: Fork PRs require notes pushed to base repository or PR head refs.
          git fetch origin +refs/notes/signoff:refs/notes/signoff-remote 2>/dev/null || true
          git notes --ref=signoff merge -s cat_sort_uniq refs/notes/signoff-remote 2>/dev/null || true

      - name: Verify Git Signoff Attestation
        run: |
          # Trust & Authenticity Model:
          # This gate validates policy compliance for Git Signoff Attestations (GSA v1.0).
          # Unsigned commit trailers/notes verify that a Socratic review was conducted.
          # For cryptographic identity binding, configure GPG/SSH signing keys (git commit -S).
          # To strictly block merges without signoff, configure GitHub Branch Protection rules for 'main'.

          set -eo pipefail

          HEAD_SHA=$(git rev-parse HEAD)
          HEAD_TREE=$(git rev-parse HEAD^{tree})
          echo "Verifying signoff attestation for PR HEAD SHA (${HEAD_SHA}) / TREE (${HEAD_TREE})..."

          IS_VALID=0

          # --- Check 1: Commit trailer on HEAD ---
          TRAILER_STATUS=$(git log -1 --format="%(trailers:key=Signoff-Status,valueonly=true)" HEAD | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          TRAILER_TREE=$(git log -1 --format="%(trailers:key=Signoff-Reviewed-Tree-SHA,valueonly=true)" HEAD | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          TRAILER_COMMIT=$(git log -1 --format="%(trailers:key=Signoff-Reviewed-Commit-SHA,valueonly=true)" HEAD | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

          if [ "$TRAILER_STATUS" = "VERIFIED_BY_HUMAN" ] || [ "$TRAILER_STATUS" = "VERIFIED_BY_HUMAN_NO_TRANSCRIPT_DIGEST" ]; then
            if [ -z "$TRAILER_TREE" ] || [ "$TRAILER_TREE" = "$HEAD_TREE" ] || [ "$TRAILER_COMMIT" = "$HEAD_SHA" ]; then
              echo "✅ Git Signoff Attestation verified via commit trailer."
              IS_VALID=1
            else
              echo "⚠️ Commit trailer found but tree SHA (${TRAILER_TREE}) does not match HEAD tree (${HEAD_TREE})."
            fi
          fi

          # --- Check 2: Git note on HEAD commit SHA ---
          if [ "$IS_VALID" -eq 0 ]; then
            NOTE_COMMIT=$(git notes --ref=signoff show HEAD 2>/dev/null || true)
            if [ -n "$NOTE_COMMIT" ]; then
              NOTE_STATUS=$(echo "$NOTE_COMMIT" | (grep -E "^Signoff-Status:" || true) | head -n 1 | cut -d':' -f2 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
              NOTE_TREE=$(echo "$NOTE_COMMIT" | (grep -E "^Signoff-Reviewed-Tree-SHA:" || true) | head -n 1 | cut -d':' -f2 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
              NOTE_COMMIT_SHA=$(echo "$NOTE_COMMIT" | (grep -E "^Signoff-Reviewed-Commit-SHA:" || true) | head -n 1 | cut -d':' -f2 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

              if [ "$NOTE_STATUS" = "VERIFIED_BY_HUMAN" ] || [ "$NOTE_STATUS" = "VERIFIED_BY_HUMAN_NO_TRANSCRIPT_DIGEST" ]; then
                if [ -z "$NOTE_TREE" ] || [ "$NOTE_TREE" = "$HEAD_TREE" ] || [ "$NOTE_COMMIT_SHA" = "$HEAD_SHA" ]; then
                  echo "✅ Git Signoff Attestation verified via commit note."
                  IS_VALID=1
                else
                  echo "⚠️ Commit note found but tree SHA (${NOTE_TREE}) does not match HEAD tree (${HEAD_TREE})."
                fi
              fi
            fi
          fi

          # --- Check 3: Git note on HEAD tree SHA (GSA §5.1 Tree Fallback for Post-Squash/Rebase) ---
          if [ "$IS_VALID" -eq 0 ]; then
            NOTE_TREE_PAYLOAD=$(git notes --ref=signoff show "$HEAD_TREE" 2>/dev/null || true)
            if [ -n "$NOTE_TREE_PAYLOAD" ]; then
              NOTE_TREE_STATUS=$(echo "$NOTE_TREE_PAYLOAD" | (grep -E "^Signoff-Status:" || true) | head -n 1 | cut -d':' -f2 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
              if [ "$NOTE_TREE_STATUS" = "VERIFIED_BY_HUMAN" ] || [ "$NOTE_TREE_STATUS" = "VERIFIED_BY_HUMAN_NO_TRANSCRIPT_DIGEST" ]; then
                echo "✅ Git Signoff Attestation verified via tree note fallback (GSA §5.1)."
                IS_VALID=1
              fi
            fi
          fi

          if [ "$IS_VALID" -eq 1 ]; then
            echo "✅ Git Signoff Attestation gate PASSED for SHA ${HEAD_SHA}."
            exit 0
          else
            echo "::error::Missing or stale Git Signoff Attestation on PR head (${HEAD_SHA})! Run /signoff on latest head and push refs/notes/signoff before merging."
            exit 1
          fi
