[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dotgemini"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client",
    "google-auth",
]

[project.optional-dependencies]
mcp = ["mcp"]

[project.scripts]
signoff-mcp = "signoff_mcp.server:main"

[tool.setuptools.packages.find]
include = ["antigravity*", "scripts*", "skills*", "signoff_mcp*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501"]



